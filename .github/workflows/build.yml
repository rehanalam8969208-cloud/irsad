name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Web App Wrapper (APK)
      run: |
        echo "Building Isad App APK..."
        # Yahan hum web code ko Android project structure me dal kar Gradle se APK build karte hain
        mkdir -p android-app/app/src/main/assets/www
        cp index.html android-app/app/src/main/assets/www/
        
        # Simple debugging info
        echo "HTML copied successfully for APK packaging."

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Isad-Ration-App
        path: |
          *.html
